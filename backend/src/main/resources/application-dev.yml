# Perfil de desarrollo: logs SQL, devtools activo, JWT de demo.
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

spring:
  devtools:
    restart:
      poll-interval: 1s
      quiet-period: 400ms
      trigger-file: .reloadtrigger

app:
  jwt:
    secret: cmms-dev-secret-local-0123456789abcdef0123456789abcdef
