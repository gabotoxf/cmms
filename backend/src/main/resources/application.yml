spring:
  application:
    name: cmms
  profiles:
    default: dev
  config:
    import: optional:file:.env.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cmms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Avatares de hasta 2 MB (el límite real lo valida AuthService).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Fase 5: correo. Sin host configurado la app arranca igual (notificaciones deshabilitadas).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:cmms-demo-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:cmms-api}
    horas-vida: ${JWT_HORAS_VIDA:8}
  mantenimiento:
    dias-alerta: ${APP_MANTENIMIENTO_DIAS_ALERTA:15}
    job-cron: ${APP_MANTENIMIENTO_JOB_CRON:0 0 2 * * *}
  ordenes:
    job-cron: ${APP_ORDENES_JOB_CRON:0 30 2 * * *}
  # Fase 5: destinatario de los reportes de alertas (vacío = no envía reporte)
  alertas:
    destinatario: ${APP_ALERTAS_DESTINATARIO:}
    job-cron: ${APP_ALERTAS_JOB_CRON:0 15 2 * * *}
    remitente: ${MAIL_REMITENTE:cmms@localhost}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  page-size-max: ${APP_PAGE_SIZE_MAX:100}
  avatar:
    dir: ${APP_AVATAR_DIR:./uploads/avatars}
  frontend:
    url: ${APP_FRONTEND_URL:http://127.0.0.1:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# JWT + cookies/devtools pueden agrandar cabeceras (defecto: 8 KB).
# El PUT multipart del avatar fallaba con 32KB/64KB/128KB/256KB (2026-09-23 header too large),
# se deja en 512KB. El frontend envía Authorization: Bearer <JWT> + cookies de devtools
# que crecen con cada login.
server:
  max-http-header-size: 512KB
  tomcat:
    max-swallow-size: 10MB

# Fase 8: límites de la carga masiva de equipos (evita subir archivos enormes y colgar la app)
cmms:
  carga-masiva:
    max-filas: ${CMMS_CARGA_MAX_FILAS:2000}
    max-archivo-bytes: ${CMMS_CARGA_MAX_BYTES:5242880}
