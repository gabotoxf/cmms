spring:
  application:
    name: cmms
  datasource:
    url: jdbc:postgresql://localhost:5432/cmms
    username: postgres
    password: postgres
  devtools:
    restart:
      poll-interval: 1s
      quiet-period: 400ms
      trigger-file: .reloadtrigger
      # Nota: el archivo trigger vive en src/main/resources y Maven lo copia a target/classes al compilar
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

app:
  jwt:
    secret: cmms-demo-secret-change-me-0123456789abcdef
    issuer: cmms-api
  mantenimiento:
    dias-alerta: 15
    job-cron: "0 0 2 * * *"
